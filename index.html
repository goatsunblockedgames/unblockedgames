<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unblocked Games Hub</title>

<!-- Google AdSense -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4335653991954613"
crossorigin="anonymous"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: Arial, sans-serif; background: linear-gradient(135deg,#667eea 0%,#764ba2 100%); min-height:100vh; padding:20px; }
.container { max-width:1200px; margin:0 auto; }
header { text-align:center; color:white; margin-bottom:30px; padding:20px; }
h1 { font-size:3em; margin-bottom:10px; text-shadow:2px 2px 4px rgba(0,0,0,0.3); }
.subtitle { font-size:1.2em; opacity:0.9; }
.games-nav { display:flex; justify-content:center; gap:15px; margin-bottom:30px; flex-wrap:wrap; }
.nav-btn { background:white; color:#667eea; border:none; padding:12px 25px; border-radius:25px; cursor:pointer; font-size:1em; font-weight:bold; transition: all 0.3s; box-shadow:0 4px 15px rgba(0,0,0,0.2); }
.nav-btn:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,0,0,0.3); }
.nav-btn.active { background: linear-gradient(135deg,#f093fb 0%,#f5576c 100%); color:white; }
.game-container { background:white; border-radius:15px; padding:30px; box-shadow:0 20px 60px rgba(0,0,0,0.3); display:none; }
.game-container.active { display:block; animation: slideIn 0.3s ease-in-out; }
@keyframes slideIn { from { opacity:0; transform:translateY(10px);} to { opacity:1; transform:translateY(0); } }
canvas { display:block; margin:20px auto; border-radius:10px; background:#f0f0f0; }
button { background: linear-gradient(135deg,#667eea 0%,#764ba2 100%); color:white; border:none; padding:10px 20px; border-radius:20px; cursor:pointer; margin:5px; transition:all 0.2s; }
button:hover { transform:scale(1.05); box-shadow:0 4px 15px rgba(102,126,234,0.4); }
button:active { transform:scale(0.95); }
@media(max-width:768px){ h1{ font-size:2em;} .games-nav{ gap:10px;} .nav-btn{ padding:10px 15px; font-size:0.9em;} canvas{ width:90%; height:auto; } }
</style>
</head>
<body>
<div class="container">
<header>
<h1>🎮 Unblocked Games Hub</h1>
<p class="subtitle">Play all games in one place!</p>
</header>

<div class="games-nav">
<button class="nav-btn active" onclick="switchGame('rpg',event)">🛡️ RPG Adventure</button>
<button class="nav-btn" onclick="switchGame('soccer',event)">⚽ Soccer Simulator</button>
<button class="nav-btn" onclick="switchGame('puzzle',event)">🧩 Puzzle Challenge</button>
</div>

<!-- AdSense Ad Placeholder -->
<ins class="adsbygoogle"
     style="display:block"
     data-ad-client="ca-pub-4335653991954613"
     data-ad-slot="1234567890"
     data-ad-format="auto"
     data-full-width-responsive="true"></ins>
<script>
(adsbygoogle = window.adsbygoogle || []).push({});
</script>

<!-- RPG Adventure -->
<div id="rpg-game" class="game-container active">
<h2>🛡️ RPG Adventure</h2>
<canvas id="rpgCanvas" width="400" height="400"></canvas>
<div class="controls">
<div>Use Arrow Keys to move and collect treasures!</div>
<button onclick="resetRPG()">New Game</button>
</div>
</div>

<!-- Soccer Simulator -->
<div id="soccer-game" class="game-container">
<h2>⚽ Soccer Simulator</h2>
<canvas id="soccerCanvas" width="400" height="400"></canvas>
<div class="controls">
<div>Use Arrow Keys to move the player and score goals!</div>
<button onclick="resetSoccer()">New Game</button>
</div>
</div>

<!-- Puzzle Challenge -->
<div id="puzzle-game" class="game-container">
<h2>🧩 Puzzle Challenge</h2>
<div class="game-board" id="puzzleBoard"></div>
<div class="controls">
<button onclick="resetPuzzle()">New Game</button>
</div>
</div>

</div>

<script>
// ===== Game Switching =====
function switchGame(game,event){
    document.querySelectorAll('.game-container').forEach(el=>el.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(el=>el.classList.remove('active'));
    document.getElementById(game+'-game').classList.add('active');
    event.currentTarget.classList.add('active');
}

// ===== RPG Adventure =====
const rpgCanvas=document.getElementById('rpgCanvas');
const rpgCtx=rpgCanvas.getContext('2d');
let player={x:200,y:200,size:20};
let treasures=[];
function spawnTreasure(){treasures=[];for(let i=0;i<5;i++){treasures.push({x:Math.random()*380,y:Math.random()*380,size:10});}}
function resetRPG(){player={x:200,y:200,size:20};spawnTreasure();drawRPG();}
document.addEventListener('keydown',(e)=>{
    if(!document.getElementById('rpg-game').classList.contains('active')) return;
    const step=10;
    if(e.key==='ArrowUp') player.y=Math.max(0,player.y-step);
    if(e.key==='ArrowDown') player.y=Math.min(380,player.y+step);
    if(e.key==='ArrowLeft') player.x=Math.max(0,player.x-step);
    if(e.key==='ArrowRight') player.x=Math.min(380,player.x+step);
    drawRPG();
});
function drawRPG(){
    rpgCtx.clearRect(0,0,400,400);
    rpgCtx.fillStyle='green';
    rpgCtx.fillRect(player.x,player.y,player.size,player.size);
    treasures.forEach((t,i)=>{
        rpgCtx.fillStyle='gold';
        rpgCtx.fillRect(t.x,t.y,t.size,t.size);
        if(Math.abs(player.x-t.x)<15 && Math.abs(player.y-t.y)<15){ treasures.splice(i,1); }
    });
}
spawnTreasure();
drawRPG();

// ===== Soccer Simulator =====
const soccerCanvas=document.getElementById('soccerCanvas');
const soccerCtx=soccerCanvas.getContext('2d');
let soccerPlayer={x:200,y:350,r:15};
let ball={x:200,y:200,r:10};
let goal={x:150,y:0,w:100,h:10};
function resetSoccer(){soccerPlayer={x:200,y:350,r:15};ball={x:200,y:200,r:10};drawSoccer();}
document.addEventListener('keydown',(e)=>{
    if(!document.getElementById('soccer-game').classList.contains('active')) return;
    const step=10;
    if(e.key==='ArrowUp') soccerPlayer.y=Math.max(0,soccerPlayer.y-step);
    if(e.key==='ArrowDown') soccerPlayer.y=Math.min(385,soccerPlayer.y+step);
    if(e.key==='ArrowLeft') soccerPlayer.x=Math.max(0,soccerPlayer.x-step);
    if(e.key==='ArrowRight') soccerPlayer.x=Math.min(385,soccerPlayer.x+step);
    // kick ball if close
    if(Math.abs(soccerPlayer.x-ball.x)<20 && Math.abs(soccerPlayer.y-ball.y)<20) ball.y-=20;
    drawSoccer();
});
function drawSoccer(){
    soccerCtx.clearRect(0,0,400,400);
    soccerCtx.fillStyle='white';
    soccerCtx.fillRect(0,0,400,400);
    // goal
    soccerCtx.fillStyle='yellow';
    soccerCtx.fillRect(goal.x,goal.y,goal.w,goal.h);
    // player
    soccerCtx.fillStyle='blue';
    soccerCtx.beginPath();
    soccerCtx.arc(soccerPlayer.x,soccerPlayer.y,soccerPlayer.r,0,Math.PI*2);
    soccerCtx.fill();
    // ball
    soccerCtx.fillStyle='red';
    soccerCtx.beginPath();
    soccerCtx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);
    soccerCtx.fill();
}

// ===== Puzzle Challenge =====
const puzzleBoard=document.getElementById('puzzleBoard');
let puzzleCards=[];
function resetPuzzle(){
    puzzleBoard.innerHTML='';
    puzzleCards=[...Array(8).keys(),...Array(8).keys()].sort(()=>Math.random()-0.5);
    puzzleCards.forEach((val,i)=>{
        const btn=document.createElement('button');
        btn.className='card';
        btn.textContent='?';
        btn.dataset.val=val;
        btn.dataset.index=i;
        btn.onclick=()=>flipCard(btn);
        puzzleBoard.appendChild(btn);
    });
}
let flipped=[];
function flipCard(btn){
    if(flipped.includes(btn)) return;
    btn.textContent=btn.dataset.val;
    flipped.push(btn);
    if(flipped.length===2){
        setTimeout(()=>{
            if(flipped[0].dataset.val!==flipped[1].dataset.val){
                flipped.forEach(b=>b.textContent='?');
            }
            flipped=[];
        },500);
    }
}
resetPuzzle();
</script>
</body>
</html>
