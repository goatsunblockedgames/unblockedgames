<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goats Unblocked | Premium Gaming</title>
    <style>
        :root {
            --primary: #bb86fc;
            --secondary: #03dac6;
            --background: #121212;
            --surface: #1e1e1e;
            --on-surface: #ffffff;
            --accent: #cf6679;
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            background-color: var(--background); 
            background-image: radial-gradient(circle at 20% 30%, #251a33 0%, #121212 100%);
            min-height: 100vh; 
            color: var(--on-surface);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Layout & Header */
        .container { width: 100%; max-width: 900px; padding: 20px; }
        
        header { text-align: center; padding: 40px 0; }
        h1 { font-size: 3.5rem; letter-spacing: -2px; margin-bottom: 10px; color: var(--primary); }
        .subtitle { opacity: 0.7; font-weight: 300; }

        /* Navigation */
        .games-nav { 
            display: flex; 
            justify-content: center; 
            gap: 12px; 
            margin-bottom: 30px; 
            flex-wrap: wrap; 
        }

        .nav-btn { 
            background: var(--surface);
            color: var(--on-surface);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 14px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .nav-btn:hover { background: #2a2a2a; transform: translateY(-2px); border-color: var(--primary); }
        .nav-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }

        /* Game Containers */
        .game-wrapper {
            background: var(--surface);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none;
            position: relative;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .game-wrapper.active { display: block; animation: fadeIn 0.4s ease-out; }

        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        canvas { 
            display: block; 
            margin: 0 auto; 
            background: #000; 
            border-radius: 12px; 
            width: 100%;
            max-width: 600px;
            height: auto;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        /* UI Elements */
        .stats-bar { display: flex; gap: 20px; margin-top: 15px; font-weight: bold; color: var(--secondary); }
        
        .controls-hint { 
            margin-top: 15px; 
            padding: 10px; 
            background: rgba(255,255,255,0.05); 
            border-radius: 8px;
            font-size: 0.85rem;
            text-align: center;
        }

        button.action-btn {
            background: var(--secondary);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Memory Game Grid */
        .puzzle-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            max-width: 400px;
            margin: 0 auto;
        }
        .card {
            aspect-ratio: 1;
            background: #333;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            transition: 0.3s;
            user-select: none;
        }
        .card.flipped { background: var(--primary); transform: rotateY(180deg); }
        .card.matched { background: var(--secondary); opacity: 0.5; cursor: default; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>GOATS</h1>
        <p class="subtitle">PREMIUM UNBLOCKED ARCADE</p>
    </header>

    <div class="games-nav">
        <button class="nav-btn active" onclick="switchGame('rpg')">🛡️ DUNGEON CRAWL</button>
        <button class="nav-btn" onclick="switchGame('soccer')">⚽ PRO STRIKER</button>
        <button class="nav-btn" onclick="switchGame('puzzle')">🧩 MEMORY MATCH</button>
    </div>

    <div id="rpg" class="game-wrapper active">
        <div class="game-header">
            <h2>Dungeon Crawl</h2>
            <button class="action-btn" onclick="initRPG()">Reset</button>
        </div>
        <canvas id="rpgCanvas" width="600" height="400"></canvas>
        <div class="stats-bar">
            <span>Score: <span id="rpgScore">0</span></span>
            <span>Level: <span id="rpgLevel">1</span></span>
        </div>
        <div class="controls-hint">Use WASD or Arrows to explore. Collect gold to level up!</div>
    </div>

    <div id="soccer" class="game-wrapper">
        <div class="game-header">
            <h2>Pro Striker</h2>
            <button class="action-btn" onclick="initSoccer()">Kick Off</button>
        </div>
        <canvas id="soccerCanvas" width="600" height="400"></canvas>
        <div class="stats-bar">
            <span>Goals: <span id="soccerScore">0</span></span>
        </div>
        <div class="controls-hint">WASD to Move. Bump the ball into the top yellow goal!</div>
    </div>

    <div id="puzzle" class="game-wrapper">
        <div class="game-header">
            <h2>Memory Match</h2>
            <button class="action-btn" onclick="initPuzzle()">Shuffle</button>
        </div>
        <div class="puzzle-grid" id="puzzleGrid"></div>
        <div class="stats-bar">
            <span>Moves: <span id="puzzleMoves">0</span></span>
        </div>
    </div>
</div>

<script>
    // --- APP LOGIC ---
    function switchGame(id) {
        document.querySelectorAll('.game-wrapper').forEach(g => g.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.target.classList.add('active');
        if(id === 'rpg') initRPG();
        if(id === 'soccer') initSoccer();
        if(id === 'puzzle') initPuzzle();
    }

    // --- RPG GAME ENGINE ---
    const rpgCanvas = document.getElementById('rpgCanvas');
    const rpgCtx = rpgCanvas.getContext('2d');
    let player = { x: 1, y: 1, score: 0, lvl: 1 };
    let dungeon = [];
    let items = [];
    const tileSize = 40;

    function initRPG() {
        dungeon = [];
        items = [];
        player.score = 0;
        document.getElementById('rpgScore').innerText = player.score;
        // Generate simple maze-like walls
        for(let y=0; y<10; y++) {
            dungeon[y] = [];
            for(let x=0; x<15; x++) {
                let isWall = (x === 0 || x === 14 || y === 0 || y === 9 || Math.random() < 0.15);
                if(x === 1 && y === 1) isWall = false;
                dungeon[y][x] = isWall ? 1 : 0;
                if(!isWall && Math.random() < 0.1 && !(x===1 && y===1)) items.push({x, y});
            }
        }
        drawRPG();
    }

    function drawRPG() {
        rpgCtx.clearRect(0,0,600,400);
        for(let y=0; y<10; y++) {
            for(let x=0; x<15; x++) {
                rpgCtx.fillStyle = dungeon[y][x] === 1 ? "#333" : "#1a1a1a";
                rpgCtx.fillRect(x*tileSize, y*tileSize, tileSize-1, tileSize-1);
            }
        }
        // Items
        rpgCtx.fillStyle = "gold";
        items.forEach(item => {
            rpgCtx.beginPath();
            rpgCtx.arc(item.x*tileSize + 20, item.y*tileSize + 20, 8, 0, Math.PI*2);
            rpgCtx.fill();
        });
        // Player
        rpgCtx.fillStyle = "#bb86fc";
        rpgCtx.shadowBlur = 10;
        rpgCtx.shadowColor = "#bb86fc";
        rpgCtx.fillRect(player.x*tileSize+8, player.y*tileSize+8, 24, 24);
        rpgCtx.shadowBlur = 0;
    }

    // --- SOCCER ENGINE (Physics Based) ---
    const sCanvas = document.getElementById('soccerCanvas');
    const sCtx = sCanvas.getContext('2d');
    let sPlayer = { x: 300, y: 300, vx: 0, vy: 0, r: 15 };
    let ball = { x: 300, y: 200, vx: 0, vy: 0, r: 10 };
    let soccerScore = 0;
    let soccerLoop;

    function initSoccer() {
        soccerScore = 0;
        document.getElementById('soccerScore').innerText = 0;
        ball = { x: 300, y: 200, vx: 0, vy: 0, r: 10 };
        sPlayer = { x: 300, y: 320, vx: 0, vy: 0, r: 15 };
        if(soccerLoop) cancelAnimationFrame(soccerLoop);
        updateSoccer();
    }

    function updateSoccer() {
        // Friction
        ball.vx *= 0.98; ball.vy *= 0.98;
        sPlayer.vx *= 0.85; sPlayer.vy *= 0.85;

        // Move
        ball.x += ball.vx; ball.y += ball.vy;
        sPlayer.x += sPlayer.vx; sPlayer.y += sPlayer.vy;

        // Walls
        if(ball.x < 10 || ball.x > 590) ball.vx *= -1;
        if(ball.y < 10 || ball.y > 390) ball.vy *= -1;

        // Collision detection
        let dx = ball.x - sPlayer.x;
        let dy = ball.y - sPlayer.y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < ball.r + sPlayer.r) {
            ball.vx = dx * 0.5;
            ball.vy = dy * 0.5;
        }

        // Goal Logic
        if(ball.y < 20 && ball.x > 200 && ball.x < 400) {
            soccerScore++;
            document.getElementById('soccerScore').innerText = soccerScore;
            ball = { x: 300, y: 200, vx: 0, vy: 0, r: 10 };
        }

        drawSoccer();
        soccerLoop = requestAnimationFrame(updateSoccer);
    }

    function drawSoccer() {
        sCtx.fillStyle = "#162b16";
        sCtx.fillRect(0,0,600,400);
        // Field Lines
        sCtx.strokeStyle = "rgba(255,255,255,0.1)";
        sCtx.strokeRect(200, 0, 200, 50);
        sCtx.fillStyle = "#ffeb3b";
        sCtx.fillRect(200, 0, 200, 5); // Goal Line
        // Objects
        sCtx.fillStyle = "white";
        sCtx.beginPath(); sCtx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); sCtx.fill();
        sCtx.fillStyle = "#03dac6";
        sCtx.beginPath(); sCtx.arc(sPlayer.x, sPlayer.y, sPlayer.r, 0, Math.PI*2); sCtx.fill();
    }

    // --- PUZZLE ENGINE ---
    let moves = 0;
    let selected = [];
    function initPuzzle() {
        moves = 0;
        document.getElementById('puzzleMoves').innerText = 0;
        const grid = document.getElementById('puzzleGrid');
        grid.innerHTML = '';
        const icons = ['🔥','💎','🍎','🚀','🎮','⭐','🍀','👻'];
        const deck = [...icons, ...icons].sort(() => Math.random() - 0.5);
        
        deck.forEach((icon, i) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.icon = icon;
            card.onclick = () => {
                if(selected.length < 2 && !card.classList.contains('flipped')) {
                    card.classList.add('flipped');
                    card.innerText = icon;
                    selected.push(card);
                    if(selected.length === 2) checkMatch();
                }
            };
            grid.appendChild(card);
        });
    }

    function checkMatch() {
        moves++;
        document.getElementById('puzzleMoves').innerText = moves;
        if(selected[0].dataset.icon === selected[1].dataset.icon) {
            selected.forEach(c => c.classList.add('matched'));
            selected = [];
        } else {
            setTimeout(() => {
                selected.forEach(c => {
                    c.classList.remove('flipped');
                    c.innerText = '';
                });
                selected = [];
            }, 700);
        }
    }

    // --- INPUT HANDLING ---
    const keys = {};
    window.addEventListener('keydown', e => {
        keys[e.key.toLowerCase()] = true;
        
        // RPG Movement
        if(document.getElementById('rpg').classList.contains('active')) {
            let oldX = player.x, oldY = player.y;
            if(e.key === 'w' || e.key === 'ArrowUp') player.y--;
            if(e.key === 's' || e.key === 'ArrowDown') player.y++;
            if(e.key === 'a' || e.key === 'ArrowLeft') player.x--;
            if(e.key === 'd' || e.key === 'ArrowRight') player.x++;
            
            if(dungeon[player.y] && dungeon[player.y][player.x] === 0) {
                // Check items
                items = items.filter(it => {
                    if(it.x === player.x && it.y === player.y) {
                        player.score += 10;
                        document.getElementById('rpgScore').innerText = player.score;
                        return false;
                    }
                    return true;
                });
                drawRPG();
            } else {
                player.x = oldX; player.y = oldY;
            }
        }
    });
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    // Soccer Movement Loop
    setInterval(() => {
        if(!document.getElementById('soccer').classList.contains('active')) return;
        const speed = 1.2;
        if(keys['w'] || keys['arrowup']) sPlayer.vy -= speed;
        if(keys['s'] || keys['arrowdown']) sPlayer.vy += speed;
        if(keys['a'] || keys['arrowleft']) sPlayer.vx -= speed;
        if(keys['d'] || keys['arrowright']) sPlayer.vx += speed;
    }, 20);

    // Initial Start
    initRPG();
</script>

</body>
</html>
